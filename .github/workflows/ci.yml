name: ci

# Provider-independent sanity checks — anyone forking the repo can run these.
# No LLM keys, no network beyond apt/pip. See docs/ for what each piece does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: lint + secret-guard (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Python compileall
        run: python -m compileall -q home-claude/cron home-claude/hooks

      - name: JSON validity
        run: |
          for f in home-claude/settings.json home-claude/settings.example-with-hooks.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('ok:', sys.argv[1])" "$f"
          done

      - name: YAML parse (registry.yaml)
        run: |
          python -c "import yaml; d=yaml.safe_load(open('home-claude/cron/registry.yaml')); print('tasks:', len(d.get('tasks', [])))"

      - name: Secret guard (high-confidence token formats)
        run: |
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9_-]{16,}|ccr-[A-Za-z0-9]{8,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+|[0-9]{8,10}:[A-Za-z0-9_-]{35}'
          # -e is required: the pattern starts with '-----' which git would
          # otherwise read as an option. -I skips binary files.
          hits=$(git grep -nIE -e "$pattern" -- . ':(exclude).githooks/' ':(exclude).github/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Possible secret/token format found in tracked files"
            exit 1
          fi
          echo "secret guard: clean"

      - name: ShellCheck (.sh)
        run: |
          if command -v shellcheck >/dev/null; then
            # --severity=warning: gate on real issues (errors + warnings), not
            # style/info notes (SC2016/SC2129 etc.) on these working scripts.
            # SC1091: don't follow sourced files; scripts are deployed standalone.
            find home-claude/cron -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning -e SC1091
            echo "shellcheck: done"
          else
            echo "shellcheck not available — skipped"
          fi

  powershell:
    name: powershell syntax (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check all .ps1
        shell: pwsh
        run: |
          $errs = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { Write-Host "PARSE ERROR: $($_.FullName)"; $e | ForEach-Object { Write-Host "  $($_.Message)" }; $errs++ }
            else { Write-Host "ok: $($_.Name)" }
          }
          if ($errs -gt 0) { exit 1 }
