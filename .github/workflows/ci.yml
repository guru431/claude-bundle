name: ci

# Provider-independent sanity checks — anyone forking the repo can run these.
# No LLM keys, no network beyond apt/pip. See docs/ for what each piece does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: lint + secret-guard (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps (requests + PyYAML)
        run: python -m pip install --quiet -r requirements.txt

      - name: Python compileall
        run: python -m compileall -q home-claude/cron home-claude/hooks

      - name: JSON validity
        run: |
          for f in home-claude/settings.json home-claude/settings.example-with-hooks.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('ok:', sys.argv[1])" "$f"
          done

      - name: YAML parse (registry.yaml) + script paths exist
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          d = yaml.safe_load(open('home-claude/cron/registry.yaml'))
          tasks = d.get('tasks', [])
          print('tasks:', len(tasks))
          # Every script: path (after stripping the install-path placeholder)
          # must exist in the bundle — cheap guard against future typos.
          missing = []
          for t in tasks:
              script = str(t.get('script', ''))
              rel = script.replace('<bundle-install-path>', '').lstrip('\\/').replace('\\', '/')
              if not rel:
                  continue
              if not (Path('home-claude') / rel).is_file():
                  missing.append(f"{t.get('name')}: {script}")
          if missing:
              print('MISSING bundle files for registry tasks:')
              print('\n'.join('  ' + m for m in missing))
              sys.exit(1)
          print('script paths: all present')
          PY

      - name: Doc/registry task-count guard
        run: python scripts/check-doc-counts.py

      - name: Secret guard (high-confidence token formats)
        run: |
          # Single source of truth for the regex is
          # home-claude/cron/lib/secret-scan.sh (also sourced by
          # .githooks/pre-commit). Do NOT inline a second copy here — it drifts
          # from the lib and silently weakens this cardinal-rule enforcement.
          . home-claude/cron/lib/secret-scan.sh
          # -e is required: the pattern starts with '-----' which git would
          # otherwise read as an option. -I skips binary files.
          hits=$(git grep -nIE -e "$SECRET_SCAN_PATTERN" -- . ':(exclude).githooks/' ':(exclude).github/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Possible secret/token format found in tracked files"
            exit 1
          fi
          echo "secret guard: clean"

      - name: ShellCheck (.sh + .githooks)
        run: |
          if command -v shellcheck >/dev/null; then
            # --severity=warning: gate on real issues (errors + warnings), not
            # style/info notes (SC2016/SC2129 etc.) on these working scripts.
            # SC1091: don't follow sourced files; scripts are deployed standalone.
            find home-claude/cron -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning -e SC1091
            shellcheck --severity=warning .githooks/pre-commit
            echo "shellcheck: done"
          else
            echo "shellcheck not available — skipped"
          fi

      - name: Pipeline smoke test (offline mock LLM provider)
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests/ -q

  powershell:
    name: powershell syntax (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check all .ps1
        shell: pwsh
        run: |
          $errs = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { Write-Host "PARSE ERROR: $($_.FullName)"; $e | ForEach-Object { Write-Host "  $($_.Message)" }; $errs++ }
            else { Write-Host "ok: $($_.Name)" }
          }
          if ($errs -gt 0) { exit 1 }
