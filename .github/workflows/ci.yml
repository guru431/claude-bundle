name: ci

# Provider-independent sanity checks — anyone forking the repo can run these.
# No LLM keys, no network beyond apt/pip. See docs/ for what each piece does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. A workflow that only lints and tests has no business
# holding a write token, and the default for a repo can be more than that.
permissions:
  contents: read

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + secret-guard (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # BOTH ends of the supported range. CI ran "3.x" only — the newest
        # release — so 3.10, the version README and the installer's own preflight
        # declare as the minimum, was never actually exercised. A 3.11+ syntax
        # or stdlib call would have passed every check and then failed on a
        # user's machine.
        python: ["3.10", "3.x"]
    steps:
      # Actions pinned by SHA, not by tag: a tag is mutable, and these run with
      # the repository checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Python deps (requests + PyYAML)
        run: python -m pip install --quiet -r requirements.txt

      - name: Python compileall (a SyntaxWarning is an error)
        # An invalid escape such as "\`" in a docstring compiles with a
        # SyntaxWarning — printed into every pytest run's output, where nobody
        # reads it — and is to become a SyntaxError in a later Python. The 3.10
        # leg does not warn (a DeprecationWarning there); the 3.x one does. -f so
        # a leftover __pycache__ cannot skip a file; scripts/ and tests/ are code
        # in this repository too.
        run: python -W error::SyntaxWarning -m compileall -q -f home-claude/cron home-claude/hooks home-claude/bin scripts tests

      - name: JSON validity
        run: |
          for f in home-claude/settings.json home-claude/settings.example-with-hooks.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('ok:', sys.argv[1])" "$f"
          done

      - name: YAML parse (registry.yaml) + script paths exist
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          d = yaml.safe_load(open('home-claude/cron/registry.yaml'))
          tasks = d.get('tasks', [])
          print('tasks:', len(tasks))
          # Every script: path (after stripping the install-path placeholder)
          # must exist in the bundle — cheap guard against future typos.
          missing = []
          for t in tasks:
              script = str(t.get('script', ''))
              rel = script.replace('<bundle-install-path>', '').lstrip('\\/').replace('\\', '/')
              if not rel:
                  continue
              if not (Path('home-claude') / rel).is_file():
                  missing.append(f"{t.get('name')}: {script}")
          if missing:
              print('MISSING bundle files for registry tasks:')
              print('\n'.join('  ' + m for m in missing))
              sys.exit(1)
          print('script paths: all present')
          # The committed machine-local manifest template must be valid YAML too
          # (it ships to users and is parsed by utils.py at runtime).
          m = yaml.safe_load(open('config/bundle.local.example.yaml'))
          assert isinstance(m, dict), 'bundle.local.example.yaml is not a mapping'
          print('bundle.local.example.yaml: valid mapping')
          PY

      - name: Registry schema guard (fields / kind / trigger grammar)
        run: python scripts/check-registry.py

      - name: Doc/registry task-count guard
        run: python scripts/check-doc-counts.py

      - name: Env template / docs reference guard
        run: python scripts/check-env-ref.py

      - name: Generated config reference is up to date
        run: python scripts/check-env-ref.py --check-table

      - name: Privacy matrix guard (docs vs each task's declared I/O)
        run: python scripts/check-io-matrix.py

      - name: AGENTS/CLAUDE mirror guard (structural)
        run: python scripts/check-agents-sync.py

      - name: Executable-bit guard
        run: |
          # Pins the CURRENT exec-bit set exactly: a dropped +x (hook/installer
          # stops being runnable after clone) and a stray +x both fail here.
          # NB: the tree is deliberately NOT uniform — most *.sh are 644 and the
          # *.py checkers are 644 too. This freezes today's state; changing which
          # files are executable is a separate, intentional decision.
          expected=".githooks/commit-msg .githooks/pre-commit .githooks/pre-merge-commit .githooks/pre-push home-claude/cron/github-push.sh scripts/enable-guard.sh"
          actual=$(git ls-files -s | awk '$1=="100755"{print $4}' | sort | xargs)
          if [ "$actual" != "$expected" ]; then
            echo "exec-bit drift!"; echo "  expected: $expected"; echo "  actual:   $actual"
            exit 1
          fi
          echo "exec bits: pinned set unchanged"

      - name: Encoding guard (.sh without BOM, .ps1 with one when non-ASCII)
        run: |
          # home-claude/CLAUDE.md § File Encoding states both rules; nothing
          # enforced either. A BOM on a .sh breaks its shebang, and a BOM-LESS
          # .ps1 carrying non-ASCII is read by PS 5.1 in the system ANSI
          # codepage — Cyrillic then turns into smart quotes that break parsing.
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            bom=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            case "$f" in
              *.sh)
                if [ "$bom" = "efbbbf" ]; then
                  echo "::error::$f has a UTF-8 BOM — it breaks the shebang"; fail=1
                fi ;;
              *.ps1)
                if [ "$bom" != "efbbbf" ] && LC_ALL=C grep -qP '[^\x00-\x7F]' "$f" 2>/dev/null; then
                  echo "::error::$f has non-ASCII content and no BOM — PS 5.1 will mis-decode it"; fail=1
                fi ;;
            esac
          done <<EOF
          $(git ls-files '*.sh' '*.ps1')
          EOF
          [ "$fail" -eq 0 ] && echo "encoding: rules hold"
          exit "$fail"

      - name: Secret guard (high-confidence token formats)
        run: |
          # Single source of truth for the regex is
          # home-claude/cron/lib/secret-scan.sh (also sourced by
          # .githooks/pre-commit). Do NOT inline a second copy here — it drifts
          # from the lib and silently weakens this cardinal-rule enforcement.
          . home-claude/cron/lib/secret-scan.sh
          # -e is required: the pattern starts with '-----' which git would
          # otherwise read as an option. -I skips binary files.
          # Only .githooks/ is excluded (it documents token FORMATS on purpose);
          # .github/ is deliberately scanned — do NOT re-add ':(exclude).github/'.
          # Honor SECRET_SCAN_ALLOW like the pre-commit and pre-push hooks do.
          # Without it this step contradicted the escape hatch the library
          # documents for exactly this case — a detector's own test fixtures,
          # which must look like the thing they detect.
          hits=$(git grep -nIE -e "$SECRET_SCAN_PATTERN" -- . ':(exclude).githooks/' \
                 | grep -vF -e "$SECRET_SCAN_ALLOW" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Possible secret/token format found in tracked files"
            exit 1
          fi
          echo "secret guard: clean"

      - name: Generated tables match their source
        run: |
          # secret-scan.sh and its two path tables are GENERATED from
          # cron/lib/secret_shapes.py. Checking it here as well as in
          # tests/test_guards.py costs nothing and catches a hand-edit of the
          # shell copy — which is the one way this "one implementation per
          # cross-cutting rule" arrangement can silently come apart.
          . home-claude/cron/lib/secret-scan.sh
          gen_scan=$(python home-claude/cron/lib/secret_shapes.py)
          gen_paths=$(python home-claude/cron/lib/secret_shapes.py paths)
          gen_allow=$(python home-claude/cron/lib/secret_shapes.py paths-allow)
          rc=0
          [ "$SECRET_SCAN_PATTERN" = "$gen_scan" ] || { echo "::error::SECRET_SCAN_PATTERN is not the generated one"; rc=1; }
          [ "$SENSITIVE_PATH_PATTERN" = "$gen_paths" ] || { echo "::error::SENSITIVE_PATH_PATTERN is not the generated one"; rc=1; }
          [ "$SENSITIVE_PATH_ALLOW" = "$gen_allow" ] || { echo "::error::SENSITIVE_PATH_ALLOW is not the generated one"; rc=1; }
          [ "$rc" -eq 0 ] && echo "generated tables: in sync"
          exit "$rc"

      - name: ShellCheck (every shell script in the repo)
        run: |
          # Not "if available … else skip": a missing shellcheck silently turned
          # this gate off and the step still passed green. It ships on
          # ubuntu-latest, so its absence is a broken runner, not a valid state.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not installed — this gate must not be skipped"
            exit 1
          fi
          # EVERY tracked shell script, not just cron/. The uncovered ones were
          # .githooks/pre-push (162 lines of `set -eu`, git rev-list and temp
          # directories — the most fragile shell in the repo), scripts/
          # install-lite.sh and scripts/enable-guard.sh. The .githooks files
          # have no .sh suffix, hence the explicit list next to the find.
          # --severity=warning: gate on real issues (errors + warnings), not
          # style/info notes (SC2016/SC2129 etc.) on these working scripts.
          # SC1091: don't follow sourced files; scripts are deployed standalone.
          files=$(git ls-files '*.sh'; git ls-files '.githooks/*')
          echo "$files" | tr ' ' '\n' | sed 's/^/  /'
          # shellcheck disable=SC2086 — intentional word splitting of the list
          echo "$files" | xargs -r shellcheck --severity=warning -e SC1091
          echo "shellcheck: done"

      - name: Push-guard shell tests
        run: |
          # cron/tests/*.sh cover push_repo and the protected-deletion guard —
          # the invariants of the ONE task that auto-commits and pushes every
          # repository on the machine. CLAUDE.md listed them as "by hand", which
          # for an unattended guard means "not run".
          git config --global user.email ci@example.invalid
          git config --global user.name  "CI"
          git config --global init.defaultBranch main
          for t in home-claude/cron/tests/test_*.sh; do
            echo "--- $t"
            bash "$t"
          done

      - name: Pipeline smoke test (offline mock LLM provider)
        env:
          CI: "1"          # tests/conftest.py: a dependency SKIP and a >3 s fast test fail
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests/ -q --durations=10

      - name: Integration tests (platform-neutral ones)
        env:
          CI: "1"
        run: |
          # `-m integration` was defined, documented and never run anywhere. The
          # Windows-only ones skip themselves by platform. The three md2pdf prints
          # through an installed browser are deselected, as in the Windows job and
          # for its reason: they test the runner image's browser, not the commit.
          python -m pytest tests/ -q -m integration \
            --deselect tests/test_md2pdf.py::test_the_installed_browser_writes_no_local_link_target \
            --deselect tests/test_md2pdf.py::test_a_local_file_in_an_iframe_does_not_reach_the_pdf \
            --deselect tests/test_md2pdf.py::test_the_title_guard_agrees_with_the_installed_browser

  powershell:
    name: powershell + pytest (windows)
    runs-on: windows-latest
    # The integration run below is ~4 minutes on a developer's Windows machine.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.x"
          cache: pip

      - name: Install Python deps
        # self-test's YAML steps only WARN without PyYAML, so half the checks it
        # advertises were silently skipped in the one job that runs it.
        run: python -m pip install --quiet -r requirements.txt

      - name: Parse-check all .ps1 (pwsh 7)
        shell: pwsh
        run: |
          $errs = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { Write-Host "PARSE ERROR: $($_.FullName)"; $e | ForEach-Object { Write-Host "  $($_.Message)" }; $errs++ }
            else { Write-Host "ok: $($_.Name)" }
          }
          if ($errs -gt 0) { exit 1 }

      - name: Parse-check all .ps1 (Windows PowerShell 5.1 — the one that RUNS them)
        shell: powershell
        run: |
          # The scripts EXECUTE under 5.1: Task Scheduler, sync.cmd and the
          # installer all call `powershell`, not `pwsh`. Parsing them only with
          # pwsh 7 meant 7-only syntax (`??`, `?:`, ternaries, chain operators)
          # passed CI and failed at 02:30 on a user's machine.
          $errs = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { Write-Host "PARSE ERROR (5.1): $($_.FullName)"; $e | ForEach-Object { Write-Host "  $($_.Message)" }; $errs++ }
            else { Write-Host "ok (5.1): $($_.Name)" }
          }
          if ($errs -gt 0) { exit 1 }

      - name: self-test (offline, source mode)
        shell: pwsh
        run: powershell -File scripts/self-test.ps1

      # The bundle is written for Windows, and until these steps its test suite
      # ran on Windows only on developers' machines: every `os.name == "nt"`
      # branch, the PowerShell tests (they skip on ubuntu by design — pwsh 7 on
      # Linux is not the runtime the scripts run under) and the bash found past
      # System32's WSL launcher went unexercised by CI. One command per step: a
      # multi-line pwsh step reports only its LAST command's exit code.
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: pytest, fast suite (windows)
        env:
          CI: "1"          # tests/conftest.py: a dependency SKIP and a >3 s fast test fail
        run: python -m pytest tests/ -q

      - name: pytest, integration (windows)
        env:
          CI: "1"
        # Real git and Git Bash, the PowerShell 5.1 installers and syncer, cscript,
        # schtasks (asserted on Windows' own tasks, which every install has) — what
        # this job installs or Windows itself guarantees.
        # Deselected: md2pdf's three prints through an INSTALLED browser. They pin
        # how a particular Edge or Chrome renders — link targets, a framed local
        # file, the title of its error page — which is true or false of whatever
        # browser the runner image shipped this week, not of the commit under test.
        # md2pdf's own logic runs in the fast suite with the browser stubbed; these
        # three stay in `pytest -m integration` on the machines md2pdf prints on.
        run: >-
          python -m pytest tests/ -q -m integration
          --deselect tests/test_md2pdf.py::test_the_installed_browser_writes_no_local_link_target
          --deselect tests/test_md2pdf.py::test_a_local_file_in_an_iframe_does_not_reach_the_pdf
          --deselect tests/test_md2pdf.py::test_the_title_guard_agrees_with_the_installed_browser
