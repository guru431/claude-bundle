# bundle.local.yaml — your machine-local pipeline config (EXAMPLE / template).
#
# Copy this to ~/.claude/bundle.local.yaml (next to the deployed .env). The
# installer does that once and NEVER overwrites it, so — unlike editing
# cron/hooks/utils.py directly — your project map and privacy policy survive a
# bundle reinstall (F5 / IDEAS "user manifest").
#
# The whole file is OPTIONAL. With no manifest (or an empty one) the pipeline
# behaves exactly as the shipped template: no project mappings, and every
# project allowed.
#
# Read by home-claude/cron/hooks/utils.py, which needs PyYAML. Once this file
# EXISTS it is a policy, and a policy that cannot be read is never ignored:
# missing PyYAML, invalid YAML, an unknown-typed field, a non-string
# project_map and a key one or two letters away from a real one (`skip_project:`)
# all DENY every project until fixed. Any other unknown key is reported as a
# configuration error. Delete the file if you want the permissive default back.
#
# After editing, preview exactly what each source WOULD send without spending a
# token or hitting the network:
#   python ~/.claude/cron/wiki/wiki-flush-sessions.py --dry-run
#   python ~/.claude/cron/memory-update.py           --dry-run
# Both print the effective policy line first.

# ── Project naming ───────────────────────────────────────────────────────────
# Map the FULL Claude Code project-dir name (~/.claude/projects/<dir>) to the
# wiki project slug you want. Run `ls ~/.claude/projects` to see the real
# directory names (they look like C--Users-you-projects-myapp). Leave empty to
# let the pipeline derive a slug from the trailing segment.
project_map: {}
#   "C--Users-you-projects-myapp": myapp
#   "C--Users-you-projects-infra": infra

# Slugs the wiki path/section normalizer recognizes when it has to resolve an
# ambiguous LLM-emitted path or free-form daily-log heading. Usually the same
# slugs as the values above.
known_projects: []
#   - myapp
#   - infra

# Where your working copies live — the PARENT directory of your per-project git
# checkouts (not ~/.claude/projects, which holds session transcripts). Only jobs
# that inspect the repos themselves use it; today that is agents-md-sync-check,
# which compares each project's CLAUDE.md with its AGENTS.md. Leave unset and
# those jobs simply no-op. The privacy policy below still applies to every
# project found here.
projects_root:
#   projects_root: ~/projects

# ── Test contract (read by ClaudeTestSweep / ClaudeTestSweepFull only) ───────
# How each project's tests are run, declared ONCE: agents read it for their
# targeted and fast runs, and the nightly sweep runs `fast` daily and `full`
# weekly. A project with no entry keeps the old behaviour — the sweep discovers
# its pytest suite. Keys are project directory names under projects_root,
# matched the way the privacy policy matches names.
#
# Every suite key is required, and no other is accepted:
#   name      `main` for the project's main suite, else a short name (A-Z a-z 0-9 _ . -)
#   cwd       the suite's directory, relative to the project (must stay inside it)
#   runner    pytest | bash | dotnet | pester | js — how the result is read
#   targeted  one file or test, `{path}` stands for it (for agents; never run by the sweep)
#   fast      the fast level, within budget_s; null = the suite has none
#   full      the full level (integration included); null = the suite has none
#   budget_s  the fast level's budget in seconds; two green nights over it in a
#             row file a P3 finding with the five slowest parts
#
# Commands run through bash from <project>/<cwd>; a bare `python` is the
# sweep's own interpreter. For a pytest suite the sweep APPENDS
# `-p no:cacheprovider --durations=5 --basetemp <dir>`, so end the command with
# pytest's own arguments. A runner other than pytest is read from its summary,
# or from marker lines your runner prints: `TESTS_RESULT pass=N fail=N skip=N`,
# `TESTS_TIMEOUT <test> after=<N>s`, `TESTS_DURATION <seconds>s <part>`,
# `TESTS_ENV <reason>`. For Pester, call cron/lib/run-pester.ps1, which prints
# them and kills a hung file. An entry the sweep cannot use is reported as ONE
# finding in the bundle's own FINDINGS.md, and that project falls back to
# discovery until it is fixed; it never affects the privacy policy below.
tests: {}
#   myapp:
#     - name: main
#       cwd: .
#       runner: pytest
#       targeted: .venv/bin/python -m pytest {path} -q
#       fast: .venv/bin/python -m pytest -q
#       full: .venv/bin/python -m pytest -q -m "not manual" --timeout=300
#       budget_s: 60
#     - name: scripts
#       cwd: scripts
#       runner: bash
#       targeted: bash tests/run.sh {path}
#       fast: bash tests/run.sh
#       full: null
#       budget_s: 30

# ── Unified privacy policy (applied to EVERY source: JSONL, memory feedback, ──
# ── plans, incidents/sessions — in BOTH the wiki flush and memory-update) ─────

# allow_projects: an ALLOWLIST. EMPTY (the default) means "all projects
# allowed". Set it to a small explicit list to make those the ONLY projects the
# pipeline ever reads — the safe first-run posture when you don't want every
# historical session shipped to an LLM.
allow_projects: []
#   - myapp
#   - infra

# skip_projects: resolved slugs to exclude from ALL sources (a denylist). Use
# this for projects that hold documents rather than knowledge, or anything you
# never want leaving the machine.
skip_projects: []
#   - client-nda-work

# skip_dirs: raw ~/.claude/projects/<dir> names to drop BEFORE slug resolution
# (e.g. a system path that accidentally became a "project").
skip_dirs: []
#   - C--Windows-System32

# skip_jsonl_projects: a backwards-compatible alias, kept so an older config
# keeps excluding what it always did. It is FOLDED INTO skip_projects — there
# is no longer any source it excludes that skip_projects would not. Prefer
# skip_projects for anything new; this key was undocumented until now, which
# meant a config could carry an exclusion nothing in the docs explained.
skip_jsonl_projects: []

# ── A safe first week ────────────────────────────────────────────────────────

# dry_run_until: hold EVERY phase in preview mode until this date (YYYY-MM-DD).
# No LLM call, no network, no writes to the wiki or the state file — the logs
# show exactly what each source WOULD have sent, per project.
#
# WIKI_BACKLOG_MAX=0 already stops a first run shipping your whole transcript
# archive, but it does nothing about the first NIGHT: everything from the last
# 48 hours goes to the provider before anyone has read a --dry-run preview.
# This is that missing brake. The installer sets it to a week out; the window
# expires by itself, which is the point — a flag you must remember to remove is
# a flag that stays on for a year. Delete the key to start immediately.
#
# The other side of a window that ends by itself: the first night that really
# sends is one nobody chose. So on the window's LAST night the pipeline sends one
# Telegram line (when Telegram is configured) summarising what the preview would
# have sent — projects, size, provider — and every preview night writes the same
# line to cron/logs/wiki-pipeline_<date>.log. Write `confirm` instead of a date
# and the window never ends on its own: the pipeline previews until you replace
# it with a date.
dry_run_until:
#   dry_run_until: 2026-09-05
#   dry_run_until: confirm

# ── Unattributed sources ─────────────────────────────────────────────────────

# collect_plans: send ~/.claude/plans/*.md to the LLM. OFF by default, and this
# is the one setting the per-project policy above CANNOT protect you on.
#
# Plan files are flat, randomly named (`cheeky-conjuring-noodle.md`) and contain
# no cwd, frontmatter or any other hint of which project they belong to. Nothing
# can attribute them — so a plan written during a `skip_projects` session looks
# exactly like any other, and `skip_projects` does not exclude it. Enabling this
# means EVERY recent plan goes to your provider, whatever it was written for.
#
# Plans are also the single richest thing on disk: whole strategies, client
# names, architecture decisions. Turn this on only if you're comfortable with
# all of that leaving the machine — or set WIKI_LLM_PROVIDER=local first, which
# keeps it on your own hardware (see docs/llm-routing.md).
collect_plans: false
