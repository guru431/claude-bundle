# Cron Task Registry — single source of truth for Windows Task Scheduler.
# Edit this file by hand, then apply with cron/admin/sync.cmd (one UAC prompt).
#
# ── File format: every field on ONE line ───────────────────────────────────
#   sync-tasks.ps1 does not read YAML; it reads a subset of it
#   (cron/admin/lib/registry-parse.ps1): `key: value` on a single line, quoted
#   or not, and `[a, b]` lists. No `>-` or `|` block scalars, no value that
#   continues on the next line, no `- item` lists under a field. PyYAML reads
#   all of those, so every check stays green while Task Scheduler gets something
#   else — `>-` was the registered description of five tasks.
#   scripts/check-registry.py rejects such a line.
#
# ── LogonType policy (default: Password) ───────────────────────────────────
#   Password (default) — task fires BEFORE the user logs in. Critical: without
#   this, every Daily/Weekly trigger that lands while the user isn't logged in
#   is silently skipped. For Password, the sync script reads a DPAPI-encrypted
#   password from %LOCALAPPDATA%\claude-bundle-cred.dat (created one-time by
#   cron/admin/save-cred.cmd, non-elevated).
#
#   Interactive — only sensible for AtLogOn triggers, where the logon event
#   IS the trigger. Set explicitly via `logon_type: interactive`.
#
#   S4U (opt-in, `logon_type: s4u`) — fires before logon like Password, but
#   Windows stores NO password: no save-cred, and changing your Windows password
#   cannot silently stop the task. The price, in Microsoft's words: "no access to
#   either the network or encrypted files". So no share (sync-tasks refuses a
#   UNC path for it), nothing that authenticates as you — Credential Manager and
#   therefore Git Credential Manager, WinRM, a Windows-authenticated proxy — and
#   with a domain account the logon itself can fail (0x8007052E). Choose it per
#   task, only for a bundle on a local disk, and watch one run before relying
#   on it.
#
# ── health_port: for services, not for scheduled jobs ──────────────────────
#   No scheduler acts on this field — the task monitors read it. For a task
#   triggered AtStartup or AtLogOn the scheduler's own answer carries no
#   information: LastRun is the moment the machine booted, and the result stays
#   0 for as long as the task counts as "running". A service that started and
#   then died therefore reads as healthy forever, and the monitor's freshness
#   rules (there to stop it crying about old runs) bury it further.
#
#   Name the port such a service listens on and the monitor probes loopback
#   instead of believing the scheduler. Leave it out for ordinary scheduled
#   tasks: they have a real exit status, and a probe would only invent failures.
#
# ── Script path policy (CRITICAL for Password tasks) ───────────────────────
#   For logon_type: password → ALWAYS use a UNC path (\\server\share\...)
#   or a LOCAL drive (C:\...). NEVER use a mapped drive (S:\, M:\, etc.).
#   Mapped drives only exist inside a user session; Password tasks fire in
#   session 0 (before logon), so a mapped-drive path resolves to nothing and
#   the launcher exits 127 with NO log file. (ClaudeTaskMonitor enforces this
#   by alerting if any Password task has a mapped-drive path in its Action.)
#
#   Mapped-drive paths are only acceptable for logon_type: interactive +
#   trigger: AtLogOn (the drive is mapped by the time the task fires).
#
#   For logon_type: s4u → a LOCAL drive only: no mapped drive, and no UNC path
#   either, because an S4U task has no credentials to open the share with.
#
# ── BUNDLE_ROOT in scripts ─────────────────────────────────────────────────
#   Every script that derives BUNDLE_ROOT via `cd "$(dirname "$0")/.."` must
#   have the correct number of `/..` for its depth.
#     cron/<file>.sh        → /..       (1 level)
#     cron/<dir>/<file>.sh  → /../..    (2 levels)
#   Python equivalent: Path(__file__).resolve().parents[1] vs parents[2].
#   A mismatch causes silent rc=1/rc=2 even when the path is correct.
#
# ── Supported `kind` values ────────────────────────────────────────────────
#   bash | python | cmd  — via the local _run-hidden.vbs launcher (hidden window)
#   vbs                  — direct `wscript.exe <script.vbs>` (already hidden)
#   python_local         — direct `python.exe <script.py>` for local C:\ scripts
#                          (used for logon-time bootstrap tasks)
#   exec                 — arbitrary executable: needs `execute:` + `script:` +
#                          optional `script_args:`. Used for service-style tasks.
#
# ── Optional `platform` field ──────────────────────────────────────────────
#   platform: windows|posix|all (default all) — gen-scheduler.py skips
#   non-POSIX tasks (anything other than all/posix) when emitting
#   systemd/launchd units. Mark a task `platform: windows` when it can only
#   run on Windows (e.g. drives Task Scheduler via PowerShell Get-ScheduledTask).
#
# ── Supported `trigger` values ─────────────────────────────────────────────
#   Daily HH:MM | Weekly <DOW> HH:MM | AtLogOn | AtStartup
#   Monthly day=N HH:MM  — uses Register-ScheduledTask -Xml internally.
#
# ── Optional `startup_delay` field ─────────────────────────────────────────
#   ISO-8601 duration (e.g. PT1M) applied to AtStartup and AtLogOn triggers.
#   Both fire while the machine is still settling — network shares not yet
#   mounted, desktop not yet up — so a task that needs either races them and
#   dies with a path-not-found. Ignored for calendar triggers.
#
# ── Optional repetition fields (repeat_every / repeat_for) ─────────────────
#   Attach a repetition pattern to a calendar trigger so the task re-fires
#   throughout the day after its initial start time. Both are ISO-8601
#   durations (PnYnMnDTnHnMnS):
#     repeat_every: PT4H   — re-run every 4 hours
#     repeat_for:   P1D    — keep repeating for 1 day after the start time
#   Example: `trigger: Daily 01:00` + `repeat_every: PT4H` + `repeat_for: P1D`
#   fires at 01:00, then every 4h until ~24h later. Implemented in
#   sync-tasks.ps1 via the <Repetition> block of the trigger XML.
#
#   P1D is the only `repeat_for` a task that also runs on POSIX may use:
#   gen-scheduler.py has no equivalent and repeats through the whole day, so
#   `Daily 01:00` + PT4H + PT8H would run three times here and six times there.
#   check-registry.py rejects any other value unless the task is
#   `platform: windows` — and, for the same reason, a Daily start time whose
#   repetition the systemd unit cannot carry past midnight.
#
# ── `timeout_hours` policy ─────────────────────────────────────────────────
#   The ceiling is the ONLY thing that ends a task that has stopped making
#   progress. In session 0 there is no terminal: an ssh asking for a passphrase,
#   a `git push` waiting on credentials or a black-holed TCP connection does not
#   fail — it BLOCKS. Task Scheduler keeps the instance alive, every later
#   trigger is dropped (MultipleInstancesPolicy=IgnoreNew), and the monitor reads
#   the state as "running" = healthy. With a 72h ceiling that is three days of
#   silence from a task that reports nothing wrong.
#
#   So: set it to roughly two to three times the task's real runtime, not to a
#   number that "surely can't be exceeded". A task killed at its ceiling shows up
#   as a failed run — which is the point; the next trigger then gets to run.
#   ClaudeTaskMonitor also alerts on a task that is still `running` past its own
#   timeout_hours, so a ceiling that is far too high blinds that check as well.
#   The LLM tasks are the exception in degree, not in kind: their calls queue
#   behind a shared provider key, so their ceilings are hours, not minutes.
#
#   Every task must state it — check-registry.py rejects a task without one.
#   Leaving it out meant 72h in Task Scheduler and NO limit in the systemd unit:
#   the same line, two behaviours. `timeout_hours: 0` says "no limit" and means
#   it on both, for a service that is supposed to run indefinitely.
#
# ── settings ───────────────────────────────────────────────────────────────
#   All tasks are registered with StartWhenAvailable=True — if a trigger is
#   missed (machine off / asleep / not present), Task Scheduler catches up at
#   the next opportunity.

version: 1
managed_marker: managed-by-registry
launcher: <bundle-install-path>\bin\_run-hidden.vbs

tasks:

  - name: ClaudeMemoryUpdate
    project: main
    description: Nightly update of ~/.claude/memory/USER.md and cross-project-notes.md from today's JSONL sessions.
    script: <bundle-install-path>\cron\memory-update.py
    kind: python
    trigger: Daily 02:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # One or two LLM calls over a night of sessions — minutes in practice, hours
    # only when the provider queue is long. 4h is well past both.
    timeout_hours: 4

  - name: ClaudeWikiPipeline
    project: main
    # Why one task and not three: ordering was never enforced between the three
    # independent phase timers, and after a missed trigger StartWhenAvailable can
    # bunch them up and fire them almost together — safe, because every phase is
    # idempotent, but it makes a per-night status unreliable and gives the shared
    # provider key three windows to collect a 429 in instead of one.
    description: Nightly wiki pipeline — runs flush, compile-sessions and build-index in ORDER, in one process. This is the default; the three phase tasks below are the advanced arrangement that runs the phases separately, and ship disabled.
    script: <bundle-install-path>\cron\wiki\wiki-pipeline.py
    kind: python
    trigger: Daily 02:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # The longest task in the bundle: three phases, one LLM call per session and
    # per project, all of them queued behind one provider key. Deliberately
    # generous — but bounded, so a wedged provider connection cannot hold the
    # instance for days and silently skip every following night.
    timeout_hours: 12

  - name: ClaudeWikiFlush
    project: main
    description: Daily wiki flush (phase 1) — JSONL sessions to daily/YYYY-MM-DD.md. ADVANCED, off by default. ClaudeWikiPipeline runs this phase in order with the other two; enable this task only if you deliberately want the three phases on separate timers.
    script: <bundle-install-path>\cron\wiki\wiki-flush-sessions.py
    kind: python
    trigger: Daily 02:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # One phase of the pipeline above, so half its ceiling.
    timeout_hours: 6
    enabled: false

  - name: ClaudeWikiCompileKB
    project: main
    description: Compile knowledge-news → wiki/kb/ (concepts/tools/people). Disabled by default — enable after you wire up a kb_sources/ source directory (or set KB_SOURCE_DIR).
    script: <bundle-install-path>\cron\wiki\wiki-compile-kb.py
    kind: python
    trigger: Daily 03:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # One LLM call per KB source; same order of magnitude as the flush phase.
    timeout_hours: 6
    enabled: false

  - name: ClaudeWikiCompileSessions
    project: main
    description: Compile daily logs into wiki/projects/ (phase 2). ADVANCED, off by default — see ClaudeWikiPipeline.
    script: <bundle-install-path>\cron\wiki\wiki-compile-sessions.py
    kind: python
    trigger: Daily 04:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # One phase of the pipeline above, so half its ceiling.
    timeout_hours: 6
    enabled: false

  - name: ClaudeWikiBuildIndex
    project: main
    description: Rebuild wiki/projects/index.md and wiki/kb/index.md (phase 3). ADVANCED, off by default — see ClaudeWikiPipeline.
    script: <bundle-install-path>\cron\wiki\wiki-build-index.py
    kind: python
    trigger: Daily 04:05
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # No LLM at all — a walk over the vault. Minutes, even on a large one.
    timeout_hours: 1
    enabled: false

  - name: ClaudeMd2PdfSync
    project: main
    description: Nightly catch-up — regenerate any PDF whose paired .md is newer. Disabled by default — needs PROJECTS_ROOT, markdown-it-py and a Chromium-family browser for bin/md2pdf.py.
    script: <bundle-install-path>\cron\md2pdf-sync.py
    kind: python
    trigger: Daily 06:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    timeout_hours: 2
    enabled: false

  - name: ClaudeGitPushAll
    project: main
    description: Auto-commit + push every git repo under the projects root. Disabled by default — set PROJECTS_ROOT in .env, dry-run with GIT_PUSH_ALL_DRY_RUN=1, then enable.
    script: <bundle-install-path>\cron\git-push-all.sh
    kind: bash
    trigger: Daily 07:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # A push over a dozen repos is minutes. The ceiling used to be 72h, and this
    # is the task that most needs a low one: a `git push` that blocks on
    # credentials in session 0 held the instance for three days, during which
    # every following night's trigger was dropped and nothing was pushed at all
    # while the monitor read the task as "running". The per-call network
    # timeouts (`git_net`, GIT_TERMINAL_PROMPT=0) are the first line; this is the
    # backstop for whatever they do not cover.
    timeout_hours: 2
    enabled: false

  - name: ClaudeHealthcheck
    project: main
    description: Daily Claude Code healthcheck — LLM-based analysis of disk/memory/services.
    script: <bundle-install-path>\cron\claude-healthcheck.sh
    kind: bash
    trigger: Daily 09:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # Metric collection plus ONE 600s LLM call — minutes. The ssh block has its
    # own BatchMode/ConnectTimeout guards; 2h is the backstop behind them.
    timeout_hours: 2

  - name: ClaudeTaskMonitor
    project: main
    description: Check all managed tasks for failures + Password+mapped-drive policy violations; alerts to Telegram.
    script: <bundle-install-path>\cron\claude-task-monitor.sh
    kind: bash
    platform: windows
    trigger: Daily 09:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # Every collection it makes carries its own 60s timeout; the whole run is
    # seconds. A monitor that hangs is the one hang nobody else reports, so its
    # own ceiling is the tightest in the registry.
    timeout_hours: 1

  - name: ClaudeTaskMonitorPosix
    project: main
    description: POSIX counterpart of ClaudeTaskMonitor — reports FAILED systemd --user units (Linux) or launchd agents with a non-zero last exit (macOS) that belong to the bundle, to Telegram. Disabled by default; enable it on Linux/macOS after generating the units with scripts/gen-scheduler.py.
    script: <bundle-install-path>\cron\claude-task-monitor.py
    kind: python
    platform: posix
    trigger: Daily 09:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # Two `systemctl`/`launchctl` queries, each with its own timeout.
    timeout_hours: 1
    enabled: false

  - name: ClaudeWikiLint
    project: main
    description: Weekly wiki health check (broken links, orphan pages, duplicates, project-collapse).
    script: <bundle-install-path>\cron\wiki\wiki-lint.py
    kind: python
    trigger: Weekly Sunday 02:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # A link/orphan walk over the vault plus an optional Telegram post.
    timeout_hours: 2

  - name: ClaudeAgentsMdSyncCheck
    project: main
    description: Weekly CLAUDE.md ↔ AGENTS.md sync check across your projects — fixes the drift in AGENTS.md itself, files only the leftovers to FINDINGS.md. Disabled by default; enable after setting projects_root in bundle.local.yaml.
    script: <bundle-install-path>\cron\agents-md-sync-check.py
    kind: python
    trigger: Weekly Sunday 07:30
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    # Up to two 300s LLM calls per project, queued behind one provider key.
    # 6h covers a couple of dozen projects with room to spare.
    timeout_hours: 6
    enabled: false

  - name: ClaudeTestSweep
    project: main
    description: Daily fast test run across every project under projects_root; a suite that turns red files a finding in that project's FINDINGS.md and alerts once. Disabled by default; enable after setting projects_root in bundle.local.yaml.
    script: <bundle-install-path>\cron\test-sweep.py
    kind: python
    trigger: Daily 05:15
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    timeout_hours: 2
    enabled: false

  - name: ClaudeTestSweepFull
    project: main
    description: Weekly full test run (adds `integration`) across every project under projects_root. Same reporting as ClaudeTestSweep. Disabled by default; enable after setting projects_root in bundle.local.yaml.
    script: <bundle-install-path>\cron\test-sweep.py
    script_args: ["--full"]
    kind: python
    trigger: Weekly Saturday 07:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    timeout_hours: 6
    enabled: false

  - name: ClaudeLogRetention
    project: main
    description: Weekly prune of cron/logs/*.log older than WIKI_LOG_RETENTION_DAYS (default 30).
    script: <bundle-install-path>\cron\log-retention.py
    kind: python
    trigger: Weekly Sunday 03:00
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    timeout_hours: 1

  - name: ClaudeWarmWindow
    project: main
    description: Warm up the Claude subscription 5h window with a minimal Haiku ping; repeats every 4h. Disabled by default — read the billing warning in claude-warm-window.sh before enabling.
    script: <bundle-install-path>\cron\claude-warm-window.sh
    kind: bash
    trigger: Daily 01:00
    repeat_every: PT4H
    repeat_for: P1D
    user: <user>
    logon_type: password
    runlevel: limited
    hidden: true
    timeout_hours: 1
    enabled: false
