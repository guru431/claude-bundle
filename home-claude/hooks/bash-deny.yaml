# bash-guard.py's rule table — edit THIS file, not the hook.
#
# Every entry is one rule matched against the full Bash command string BEFORE
# shell parsing, so it also sees a command wrapped in `ssh host "..."`.
#
#   pattern   — a Python regular expression (case-sensitive unless you add (?i))
#   reason    — shown to the model verbatim; say WHAT to do instead, not just no
#   severity  — deny (block outright) | ask (make the user confirm)
#
# The point of a table is that adding a rule is a data change. The iptables rule
# below used to be a whole Python file of its own; anything you want to add now
# is four lines here.
#
# These are guards against the obvious spellings, NOT a sandbox. A command can
# still reach the same effect through a variable, a temp file plus `mv`, or a
# script — see hooks/README.md. Do not let a pattern grow permissive in the hope
# of catching more: a false positive blocks real work and teaches everyone to
# reach for the bypass.
#
# EVERY rule is evaluated, and `deny` beats `ask`. The hook used to stop at the
# first match, so `git push --force origin main && rm -rf /` came back as the
# force-push rule's `ask` and the `rm -rf /` denial below was never looked at.
# The order of this file therefore means nothing.
#
# Each command is matched twice: as written, and with the spellings that change
# nothing for the shell but hide a word from a regex taken out — quotes around a
# whole word (`'cat' .env`) and a backslash inside one (`c\at .env`). Write
# patterns against the plain spelling. tests/test_bash_guard.py holds a
# must-match / must-pass table for every rule; add your cases there.

rules:
  - pattern: '(ip6?tables(?:-legacy|-nft)?-save|\bnetfilter-persistent\s+save\b)[^;&]*(?:>>?|\btee\b|\bsponge\b|\bdd\s+of=|(?<![\w-])-f\b|--file\b)[^;&]*rules\.v[46](?![\w.-])'
    severity: deny
    reason: >-
      `iptables-save > /etc/iptables/rules.v[46]` is blocked. Dynamic rules
      (sslh transparent, fail2ban, cascade MASQUERADE, iproute2 helpers) end up
      in rules.v4, duplicate on boot and drift from the install script.
      Instead: edit rules.v4 with Read+Edit, remove a runtime rule with an
      explicit `iptables -D <chain> <rule>`, or re-run the relevant section of
      your install script.

  # The opening `@'` of a here-string is followed by a line break — PowerShell
  # requires one. Matching a bare `@'` or `'@` denied `git commit -m 'fix @'`.
  - pattern: '\bcommit\b[^;&]*@''\r?\n'
    severity: deny
    reason: >-
      A PowerShell here-string (@'...'@) in a `git commit` run through Bash. Bash
      has no such syntax, so the @ characters land in the commit message itself.
      The fix is shell-agnostic: write the message to a file and
      `git commit -F <file>`. A single-line `git commit -m "..."` is fine.

  # Two lookaheads, so the flag and the branch may come in either order —
  # `git push origin main --force` used to pass. `git -C <dir>` and other global
  # options are allowed before `push`. `--force` must be the whole option:
  # `--force-with-lease` and `--force-if-includes` are the SAFE spellings. The
  # branch must be a whole ref name: `feature/main-fix` is not main.
  # OR the force is in the refspec: `+main`, `+HEAD:main`, `+feature:master` —
  # main/master as the DESTINATION. `+feature` and `+main:feature` push elsewhere.
  - pattern: '\bgit(?:\s+-[Cc]\s+(?:"[^"]*"|''[^'']*''|\S+)|\s+--[\w-]+(?:=\S+)?)*\s+push\b(?:(?=[^;&|\n]*(?:--force(?![\w-])|(?<![\w-])-[A-Za-z]*f[A-Za-z]*(?![\w-])))(?=[^;&|\n]*(?:(?<![\w./-])|(?<=heads/))(?:main|master)(?![\w./-]))|(?=[^;&|\n]*(?<![\w-])\+(?:[^\s:;&|]*:)?(?:refs/heads/)?(?:main|master)(?![\w./:-])))'
    severity: ask
    reason: >-
      A force-push to main/master rewrites published history for everyone who
      has cloned it. Use `--force-with-lease` (which refuses if the remote moved
      under you), or push to a branch and open a PR.

  # The first two lookaheads find "recursive" and "force" anywhere in the run of
  # options, so `rm -r -f /`, `rm --recursive --force /` and `rm -rf -- /` are
  # the same command as `rm -rf /` — they used to pass. The third finds a bare
  # root among ANY of the targets, as a whole word: `/`, a Git Bash drive
  # (`/c/`), `C:\`, `~` or `$HOME`, with an optional trailing `/` or `*`.
  # `rm -rf /tmp/x /` deletes the root as surely as `rm -rf /`, and used to pass.
  - pattern: '\brm(?=(?:\s+-[\w-]*)*?\s+(?:-[A-Za-z]*[rR][A-Za-z]*|--recursive)(?=\s))(?=(?:\s+-[\w-]*)*?\s+(?:-[A-Za-z]*f[A-Za-z]*|--force)(?=\s))(?=[^;&|)\n]*?\s"?(?:/\*?|/[A-Za-z]/?\*?|~/?\*?|\$HOME/?\*?|\$\{HOME\}/?\*?|[A-Za-z]:[\\/]\*?)"?(?=\s|$|[;&|)]))'
    severity: deny
    reason: >-
      `rm -rf` aimed at a filesystem root or a whole home directory. If you
      meant a specific subdirectory, name it in full — this pattern only fires
      on the bare root forms.

  # `.env.example` / `.sample` / `.template` / `.dist` are the templates a
  # project SHOULD commit — the same exception cron/lib/secret_shapes.py makes
  # in SENSITIVE_PATH_ALLOW — and reading one used to ask. A Windows path
  # (`C:\proj\.env`) and a quoted one count as a path boundary.
  - pattern: '\b(?:cat|less|more|head|tail|bat)\b[^;&|\n]*(?:^|[\s/\\"''])\.env(?!\.(?:example|sample|template|dist)(?![\w-]))(?:\.[A-Za-z0-9_.-]+)?(?:[\s"'';&|)]|$)'
    severity: ask
    reason: >-
      Printing a .env puts live credentials into the transcript, which is then
      stored on disk and — if the wiki pipeline is enabled — sent to an LLM
      provider. To check whether a KEY exists, use
      `grep -c '^NAME=' .env` instead of reading the file.

  # Same global-option prefix as the force-push rule: `git -C <dir> commit`.
  # For `git commit`, `-n` IS `--no-verify` — alone or in a cluster of flags
  # that take no value (`-an`, `-nm "msg"`). Looked for only before the first
  # quote, so `-m "head -n 5"` is a message, not a flag; `-uno` and `-mnew` carry
  # values, not -n. For `git push`, `-n` is --dry-run and is left alone.
  - pattern: '\bgit(?:\s+-[Cc]\s+(?:"[^"]*"|''[^'']*''|\S+)|\s+--[\w-]+(?:=\S+)?)*\s+(?:(?:commit|push)\b[^;&|\n]*--no-verify|commit\b[^;&|\n"'']*?(?<![\w-])-[apseiovqz]*n[apseiovqz]*(?:[mFCctuS]\S*)?(?![\w-]))'
    severity: ask
    reason: >-
      `--no-verify` (for `git commit`, also `-n`) switches off the secret-guard
      hooks for the whole commit/push, not just the line you believe is a false
      positive. Prefer the inline `# secret-scan:allow` marker, which is per-line
      and shows up in the diff.
