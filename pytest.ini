[pytest]
# The reference implementation of the "Tests — one policy" rules in
# home-claude/CLAUDE.md § Test policy (the copy this repo ships; on a deployed
# machine it lives at ~/.claude/CLAUDE.md). A bare `pytest` = the fast suite,
# 60s budget; anything slower than a second, or reaching outside the process,
# is `integration`.
# `testpaths` is mandatory: without it pytest collects test_*.py out of
# third-party packages.
testpaths = tests
markers =
    integration: slower than a second, or reaching outside the process (git, shells, PowerShell, installers, a browser)
    manual: run by hand, never part of the sweep
# The policy says to mark a test `integration` BY MEASUREMENT, never by
# directory name: `--durations=N` on the command line is that measurement (the
# test sweep adds its own `--durations=5`). On CI (CI=1) tests/conftest.py also
# acts on it: a fast-suite test whose call takes over three seconds fails there.
addopts = -m "not integration and not manual"
# Not here: `-n auto` (pytest-xdist). The whole fast suite needs it to fit its
# 60 s budget on Windows; a single file or test does not, and pays for the
# workers' start-up.
# pytest-timeout (requirements-dev.txt): a hung test fails after 30 s instead of
# holding the run until whatever runs it gives up. The slowest fast test takes
# about a second; a slower level passes its own `--timeout=N`. On Windows the
# plugin uses its `thread` method, which ends the whole pytest process.
timeout = 30
