[pytest]
# Канон «Тесты — единая политика» (~/.claude/CLAUDE.md): голый `pytest` = быстрый
# набор с бюджетом 60 с; всё, что дольше секунды или лезет наружу, — `integration`.
# `testpaths` обязателен: без него pytest собирает test_*.py из чужих пакетов.
testpaths = tests
markers =
    integration: гоняет вики-пайплайн целиком через subprocess
    manual: запускается руками, в свипе не участвует
addopts = -m "not integration and not manual"
